<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Time ERP</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:20px;
}

h1{
color:#ff3b30;
}

.card{
background:#1f1f1f;
padding:20px;
margin:15px;
border-radius:15px;
}

input,select{
width:90%;
padding:12px;
margin:8px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
width:90%;
padding:14px;
background:#ff3b30;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}
</style>

</head>

<body>

<h1>Fitness Time ERP</h1>

<div class="card">

<h2>إضافة عميل</h2>

<input placeholder="اسم العميل">

<input placeholder="رقم الهاتف">

<select>
<option>مدة الاشتراك</option>
<option>شهر</option>
<option>3 شهور</option>
<option>6 شهور</option>
<option>سنة</option>
</select>

<button>حفظ العميل</button>

</div>

<div class="card">
<h2>الإحصائيات</h2>

<p>إجمالي العملاء : 0</p>

<p>عملاء المتابعة : 0</p>

<p>الاشتراكات المنتهية : 0</p>

</div>

</body>
</html>
